<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AU Small Finance Bank</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    html,
    body {
      height: 100%;
      /* overflow: hidden; <-- no longer needed without the canvas */
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #fff3e0;/ Light orange → soft purple /
    }

    / Live animated background using gradient and keyframes / body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(-45deg, #fff3e0, #f9d5ec, #fcd5ce, #e9d5ec, #fce4ec, #e0c3fc, #f9d9c2);
      background-size: 400% 400%;
      animation: gradientFlow 15s ease infinite;
      z-index: -1;
      opacity: 0.7;
      filter: blur(6px);
      pointer-events: none;
      transition: opacity 0.5s;
    }

    @keyframes gradientFlow {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    / ---------------- login box ---------------- / .login-box {
      position: relative;
      background: rgba(255, 255, 255, 0.97);
      padding: 120px 40px 50px;
      border-radius: 16px;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.25);
      width: 100%;
      max-width: 420px;
      text-align: center;
      border: 1px solid #6d3078;/ AU orange /
    }

    / profile image / .profile-container {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%) translateY(-50%);
    }

    .profile-img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 6px solid #fff;
      background: #e0e0e0;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }

    .profile-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    / headings & inputs / .login-box h1 {
      color: #6d3078;/ AU purple / margin-bottom: 30px;
      font-size: 28px;
    }

    .input-field {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      background-color: #fff3e0;
      color: #6c2d77;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    .input-field:focus {
      border-color: #f37435;
      outline: none;
      box-shadow: 0 0 4px #f37435;
    }

    / buttons / .btn {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      background-color: #6d3078;/ AU purple / border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn:hover {
      background-color: #6d3078;
    }

    .options {
      margin-top: 15px;
      display: flex;
      justify-content: space-between;
    }

    .options button {
      background: none;
      border: none;
      color: #fe7433;/ AU orange / text-decoration: underline;
      cursor: pointer;
      font-size: 14px;
    }

    / misc / .error {
      color: red;
      margin-top: 10px;
      font-size: 14px;
    }

    footer {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      color: #6c2d77;
      font-size: 14px;
    }

    footer a {
      color: #6c2d77;
      text-decoration: none;
    }
  </style>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body> <!-- Removed canvas background -->
  <div class="login-box">
    <div class="profile-container">
      <div class="profile-img"> <img src="{{url_for('static', filename='profile_image.png')}}" alt="Profile Image" />
      </div>
    </div> <input type="text" id="username" class="input-field" placeholder="Username" /> <input type="password"
      id="password" class="input-field" placeholder="Password" /> <button class="btn" onclick="login()">Login</button>
    <div class="options"> <button onclick="redirectToRecovery('first_time')"> First Time Login </button> <button
        onclick="redirectToRecovery('forgot_password')"> Forgot Password? </button> </div>
    <div id="error" class="error"></div>
  </div>
  <footer> <span class="footer-text"> © <a href="https://www.aubank.in" target="_blank">AU Small Finance Bank
        Limited</a> </span> </footer>
  <script>
    /* ---------- basic dummy auth ---------- */
    function login() { const username = $("#username").val().trim(); const password = $("#password").val().trim(); const errorEl = $("#error"); if (!username || !password) { errorEl.css("color", "red").text("Both fields are required."); return; } if (username === "admin" && password === "pass123") { errorEl.css("color", "green").text("Login successfull! Redirecting..."); setTimeout(() => { errorEl.text(""); window.location.href = "/frontpage"; }, 2000); } else { errorEl.css("color", "red").text("Invalid username or password."); } } function redirectToRecovery(type) { if (type === "first_time") { window.location.href = "/first_time_login"; } else if (type === "forgot_password") { window.location.href = "/forgot_password"; } }
  </script>
</body>

</html>
