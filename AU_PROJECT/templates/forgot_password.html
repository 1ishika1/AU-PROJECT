<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    #background-canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: -1;
    }

    body {
      background: linear-gradient(to right, #2c5364, #203a43, #0f2027);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {
      background-color: #ffffffdd;
      padding: 40px 30px;
      border-radius: 12px;
      text-align: center;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 12px 24px rgba(0,0,0,0.2);
      z-index: 1;
    }

    h1 {
      color: #0047b3;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background-color: #0073e6;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 15px;
    }

    .btn:hover {
      background-color: #005bb5;
    }

    a {
      display: block;
      margin-top: 15px;
      color: #0073e6;
      text-decoration: underline;
    }

    #error {
      color: red;
      margin-top: 10px;
      font-size: 14px;
      text-align: left;
      min-height: 20px;
    }
  </style>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

  <!-- Live Background Canvas -->
  <canvas id="background-canvas"></canvas>

  <div class="box">
    <h1>Forgot Password</h1>
    <input type="text" id="user_id" placeholder="Enter User ID" autocomplete="off" />
    <input type="email" id="email" placeholder="Enter Registered Email" autocomplete="off" />
    <button class="btn" onclick="sendResetLink()">Send Reset Link</button>

    <div id="error"></div>

    <a href="{{ url_for('login_page') }}">Back to Login</a>
  </div>

  <script>
    function sendResetLink() {
      const userId = $('#user_id').val().trim();
      const email = $('#email').val().trim();
      const error = $('#error');
      error.css('color', 'red').text('');

      if (!userId || !email) {
        error.text('Both User ID and Email are required.');
        return;
      }

      // Basic email validation regex
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        error.text('Please enter a valid email address.');
        return;
      }

      // Send AJAX POST request
      $.ajax({
        url: '/forgot_password',  // Adjust backend URL accordingly
        method: 'POST',
        data: {
          user_id: userId,
          email: email
        },
        success: function(response) {
          if (response.status === 'success') {
            error.css('color', 'green').text('Reset link sent! Check your email.');
            setTimeout(() => error.text(''), 4000);
          } else {
            error.css('color', 'red').text(response.message || 'Failed to send reset link.');
          }
        },
        error: function() {
          error.css('color', 'red').text('Server error. Please try again later.');
        }
      });
    }

    // Canvas background animation (same as your existing code)
    const canvas = document.getElementById("background-canvas");
    const ctx = canvas.getContext("2d");
    let width, height, particles;

    function initCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      particles = [];

      for (let i = 0; i < 120; i++) {
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 1.2,
          vy: (Math.random() - 0.5) * 1.2,
          radius: Math.random() * 1.5 + 1,
        });
      }
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);
      for (let i = 0; i < particles.length; i++) {
        const p1 = particles[i];
        ctx.beginPath();
        ctx.arc(p1.x, p1.y, p1.radius, 0, Math.PI * 2);
        ctx.fillStyle = "#66b3ff";
        ctx.fill();

        for (let j = i + 1; j < particles.length; j++) {
          const p2 = particles[j];
          const dx = p1.x - p2.x;
          const dy = p1.y - p2.y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 100) {
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = "rgba(102, 179, 255, 0.08)";
            ctx.stroke();
          }
        }

        p1.x += p1.vx;
        p1.y += p1.vy;

        if (p1.x < 0 || p1.x > width) p1.vx *= -1;
        if (p1.y < 0 || p1.y > height) p1.vy *= -1;
      }

      requestAnimationFrame(draw);
    }

    window.addEventListener("resize", initCanvas);
    initCanvas();
    draw();
  </script>

</body>
</html>
